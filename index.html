<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KinkSync</title>
<style>
:root{--bg:#FAF7F5;--card:#FFF;--soft:#F3ECE7;--inp:#F9F6F4;--bdr:#E6DCD5;--burg:#7A1C32;--txt:#231B20;--mut:#73656C;--yes:#0D9488;--cur:#D97706;--no:#E11D48}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:60px}
header{background:#FFF;border-bottom:1px solid var(--bdr);padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.35rem;color:var(--burg);font-weight:800;letter-spacing:-0.02em}
.sub{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--mut);display:block}
.btn{border:1px solid transparent;border-radius:9px;padding:8px 12px;font-size:0.76rem;font-weight:600;cursor:pointer;background:var(--burg);color:#FFF}
.btn-g{background:var(--soft);border-color:var(--bdr);color:var(--txt)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);padding:4px;border-radius:11px;border:1px solid var(--bdr);margin:12px 14px;gap:4px}
.tbtn{background:transparent;border:none;color:var(--mut);padding:9px 2px;font-size:0.75rem;font-weight:600;border-radius:8px;cursor:pointer}
.tbtn.act{background:#FFF;color:var(--burg);box-shadow:0 2px 5px rgba(0,0,0,0.06);font-weight:700}
main{max-width:600px;margin:0 auto;padding:0 14px}
.sec{display:none}.sec.act{display:block}
.card{background:#FFF;border:1px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.lbl{display:block;font-size:0.68rem;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase}
input[type=text],select,textarea{background:var(--inp);border:1px solid var(--bdr);color:var(--txt);padding:9px;border-radius:8px;font-size:0.84rem;width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;text-align:center}
.sp{background:#FFF;border:1px solid var(--bdr);border-radius:10px;padding:7px 2px;font-size:0.7rem;font-weight:600;cursor:pointer}
.sp b{display:block;font-size:0.88rem;margin-top:2px}
.cat{background:#FFF;border:1px solid var(--bdr);border-radius:14px;overflow:hidden;margin-bottom:14px}
.cat-h{background:#F7EFEA;padding:11px 14px;border-bottom:1px solid var(--bdr);font-weight:700;color:var(--burg);font-size:0.95rem}
.row{padding:11px 14px;border-bottom:1px solid #F1EAE4}
.row:last-child{border-bottom:none}
.rmain{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rname{font-size:0.84rem;font-weight:500}
.rbtns{display:flex;gap:4px;flex-shrink:0}
.rb{width:32px;height:32px;border-radius:8px;border:1px solid var(--bdr);background:var(--inp);cursor:pointer;font-size:0.78rem;opacity:0.35}
.rb.on-yes{background:#E6F7F5;border-color:var(--yes);opacity:1}
.rb.on-cur{background:#FEF3C7;border-color:var(--cur);opacity:1}
.rb.on-neu{background:#F1F5F9;border-color:#64748B;opacity:1}
.rb.on-no{background:#FFE4E6;border-color:var(--no);opacity:1}
.pos{margin-top:8px;padding-top:6px;border-top:1px dashed var(--bdr);display:none;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--mut)}
.pos.show{display:flex}
.pb{font-size:0.68rem;padding:3px 8px;border-radius:6px;border:1px solid var(--bdr);background:var(--inp);color:var(--mut);cursor:pointer;margin-left:3px}
.pb.on{background:var(--burg);color:#FFF;border-color:var(--burg);font-weight:600}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.chk{display:flex;align-items:center;gap:6px;padding:8px;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;font-size:0.76rem}
.tag{display:inline-block;font-size:0.73rem;padding:4px 8px;border-radius:6px;margin:2px;font-weight:600}
.t-yes{background:#E6F7F5;color:#0F766E}.t-cur{background:#FEF3C7;color:#92400E}.t-no{background:#FFE4E6;color:#9F1239}.t-syn{background:#FDF4F6;border:1px solid var(--burg);color:var(--burg)}
</style>
</head>
<body>
<header>
  <div><h1>KinkSync</h1><span class="sub">Accords, Désirs & Limites</span></div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-g" onclick="resetApp()">↺</button>
    <button class="btn" onclick="shareApp()">Partager</button>
  </div>
</header>
<div class="tabs">
  <button class="tbtn act" id="tb-1" onclick="goTab(1)">1. Pratiques</button>
  <button class="tbtn" id="tb-2" onclick="goTab(2)">2. Sécurité</button>
  <button class="tbtn" id="tb-3" onclick="goTab(3)">3. Comparer</button>
</div>
<main>
  <div id="sec-1" class="sec act">
    <div class="card">
      <div class="grid2">
        <div><label class="lbl">Mon Pseudo</label><input type="text" id="pseudo" placeholder="Ex: S." oninput="save()"></div>
        <div>
          <label class="lbl">Mon Rôle</label>
          <select id="role" onchange="changeRole()">
            <option value="Dominant(e)">Dominant(e)</option>
            <option value="Soumis(e)">Soumis(e)</option>
            <option value="Switch" selected>Switch</option>
            <option value="Exploration">En exploration</option>
          </select>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="sp" onclick="flt('yes')">🟢 Oui <b id="c-yes">0</b></div>
      <div class="sp" onclick="flt('cur')">🟡 Curieux <b id="c-cur">0</b></div>
      <div class="sp" onclick="flt('neu')">⚪ Neutre <b id="c-neu">46</b></div>
      <div class="sp" onclick="flt('no')">🔴 Limit <b id="c-no">0</b></div>
    </div>
    <div id="list-box"></div>
  </div>
  <div id="sec-2" class="sec">
    <div class="card">
      <div style="font-weight:700;color:var(--burg);margin-bottom:8px">Safewords (Mots d'arrêt)</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">
        <div><label class="lbl">Vert</label><input type="text" id="sw-g" value="Vert" oninput="save()"></div>
        <div><label class="lbl">Orange</label><input type="text" id="sw-o" value="Orange" oninput="save()"></div>
        <div><label class="lbl">Rouge</label><input type="text" id="sw-r" value="Rouge" oninput="save()"></div>
      </div>
      <label class="lbl">Signal Non-Verbal (si bâillon)</label>
      <input type="text" id="sw-nv" placeholder="Ex: Lâcher un objet, taper 3 fois..." oninput="save()">
    </div>
    <div class="card"><div style="font-weight:700;color:var(--burg)">Allergies</div><div id="g-all" class="chk-grid"></div></div>
    <div class="card"><div style="font-weight:700;color:var(--burg)">Fragilités Physiques</div><div id="g-med" class="chk-grid"></div></div>
    <div class="card"><div style="font-weight:700;color:var(--burg)">Aftercare souhaité</div><div id="g-aft" class="chk-grid"></div></div>
    <div class="card"><div style="font-weight:700;color:var(--burg);margin-bottom:6px">Observations & Limites</div><textarea id="notes" rows="3" placeholder="Précisions, phobies, santé..." oninput="save()"></textarea></div>
  </div>
  <div id="sec-3" class="sec">
    <div class="card">
      <div style="font-weight:700;color:var(--burg);margin-bottom:8px">Mode de comparaison</div>
      <div class="grid2" style="margin-bottom:10px">
        <button class="tbtn act" id="m-duo" style="border:1px solid var(--bdr)" onclick="setM('duo')">Duo (Affinités)</button>
        <button class="tbtn" id="m-ds" style="border:1px solid var(--bdr)" onclick="setM('ds')">Protocole D/s (Tout)</button>
      </div>
      <textarea id="p-code" rows="2" placeholder="Colle ici le lien ou code reçu du partenaire..." style="margin-bottom:10px;font-family:monospace;font-size:0.75rem"></textarea>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" onclick="compare()">Comparer</button>
        <button class="btn btn-g" onclick="demo()">Test Démo</button>
      </div>
    </div>
    <div id="comp-res"></div>
  </div>
</main>
<script>
const CATS=[
  ["1. Dynamiques & Contrôle Mental",["Collier et laisse","Discipline & Règles strictes","Positions et attitudes imposées","Dynamique Maître(sse) / Esclave","Frustration sexuelle","Cocufication (Cuckolding)","Gay imposé / Initiation bi"]],
  ["2. Entraves, Attaches & Privation",["Bondage (menottes, sangles, liens)","Shibari (cordes japonaises)","Ties and denial (attaché & privé)","Privations sensorielles","Enfermement (cage, pièce)"]],
  ["3. Contrôle Sexuel & Sextoys",["Chasteté imposée (cage)","Privation d'orgasme","Contrôle de l'orgasme / Edging","Godes / Sextoys (Vaginal)","Godes / Sextoys (Anal)","Dilatation (Vaginale)","Dilatation (Anale)","Fisting (Vaginal)","Fisting (Anal)"]],
  ["4. Sensations, Impact & Supplices",["Fessées (Spanking)","Fouet, cravache, martinet","Châtiments corporels","Bougies / Cire chaude","Électro-stimulation","Tortures des seins","Tortures des parties génitales"]],
  ["5. Domination Orale & Fluides",["Facesitting","Face fucking / Gorge profonde","Manger sperme / Avaler","Crachat","Uro (Douche dorée)","Scato"]],
  ["6. Jeux de Rôles & Fétichismes",["Jeux de Rôles","Mises en scène","Tenues imposées","Cuir, latex & vinyle","Uniformes","Pony-play","Puppy-play / Pet-play","Travestissement","Fétichisme (pieds, lingerie...)"]],
  ["7. Humiliation, Médical & Groupe",["Humiliations","Jeux médicaux","Marquage / perçage temporaire","Marquage / perçage permanent","Être photographié(e) / Filmé(e)","Exhibition","Voyeurisme (regarder)","Échangisme","Sexualité de groupe ou orgie"]]
];
const ALL=["Latex","Silicone","Cuir","Nickel / Métaux","Cire / Parfums","Huiles"];
const MED=["Épaules sensibles","Poignets fragiles","Genoux fragiles","Dos / Lombaires","Asthme","Peau sensible","Claustrophobie"];
const AFT=["Câlins & contact","Couverture chaude","Boisson sucrée","Silence & calme","Mots rassurants","Débriefing"];
let S={p:"",r:"Switch",ans:{},dir:{},cdir:{},sw:["Vert","Orange","Rouge",""],all:[],med:[],aft:[],n:""};
let curFlt=null,mode="duo";
function defDir(r){return r==="Dominant(e)"?"Dom":r==="Soumis(e)"?"Sub":"Switch";}
function goTab(n){[1,2,3].forEach(i=>{document.getElementById("sec-"+i).className=i===n?"sec act":"sec";document.getElementById("tb-"+i).className=i===n?"tbtn act":"tbtn";});}
function changeRole(){S.r=document.getElementById("role").value;const d=defDir(S.r);CATS.forEach((c,ci)=>c[1].forEach((_,ii)=>{const k=ci+"_"+ii;if(!S.cdir[k])S.dir[k]=d;}));save();draw();}
function setAns(k,v){S.ans[k]=v;if((v==="yes"||v==="cur")&&!S.cdir[k])S.dir[k]=defDir(S.r);save();draw();}
function setPos(k,p){S.dir[k]=p;if(p!==defDir(S.r))S.cdir[k]=1;else delete S.cdir[k];save();draw();}
function flt(f){curFlt=curFlt===f?null:f;draw();}
function draw(){
  let cnt={yes:0,cur:0,neu:0,no:0},html="",dDef=defDir(S.r);
  CATS.forEach((c,ci)=>{
    let rows="";
    c[1].forEach((name,ii)=>{
      const k=ci+"_"+ii,v=S.ans[k]||"neu",d=S.dir[k]||dDef;
      cnt[v]++;
      if(curFlt&&v!==curFlt)return;
      const showPos=(v==="yes"||v==="cur")?"pos show":"pos";
      rows+=`<div class="row"><div class="rmain"><span class="rname">${name}</span><div class="rbtns"><button class="rb ${v==='yes'?'on-yes':''}" onclick="setAns('${k}','yes')">🟢</button><button class="rb ${v==='cur'?'on-cur':''}" onclick="setAns('${k}','cur')">🟡</button><button class="rb ${v==='neu'?'on-neu':''}" onclick="setAns('${k}','neu')">⚪</button><button class="rb ${v==='no'?'on-no':''}" onclick="setAns('${k}','no')">🔴</button></div></div><div class="${showPos}"><span>Position :</span><div><button class="pb ${d==='Dom'?'on':''}" onclick="setPos('${k}','Dom')">Donneur</button><button class="pb ${d==='Sub'?'on':''}" onclick="setPos('${k}','Sub')">Receveur</button><button class="pb ${d==='Switch'?'on':''}" onclick="setPos('${k}','Switch')">Switch</button></div></div></div>`;
    });
    if(rows)html+=`<div class="cat"><div class="cat-h">${c[0]}</div>${rows}</div>`;
  });
  document.getElementById("list-box").innerHTML=html||"<div class='card'>Aucune pratique dans ce filtre.</div>";
  ["yes","cur","neu","no"].forEach(x=>document.getElementById("c-"+x).textContent=cnt[x]);
}
function drawChecks(){
  const mk=(id,arr,key)=>{document.getElementById(id).innerHTML=arr.map(x=>`<label class="chk"><input type="checkbox" ${S[key].includes(x)?"checked":""} onchange="tgChk('${key}','${x}')"><span>${x}</span></label>`).join("");};
  mk("g-all",ALL,"all");mk("g-med",MED,"med");mk("g-aft",AFT,"aft");
}
function tgChk(key,val){const i=S[key].indexOf(val);if(i>-1)S[key].splice(i,1);else S[key].push(val);save();}
function save(){
  S.p=document.getElementById("pseudo").value;
  S.sw=[document.getElementById("sw-g").value,document.getElementById("sw-o").value,document.getElementById("sw-r").value,document.getElementById("sw-nv").value];
  S.n=document.getElementById("notes").value;
  localStorage.setItem("ks_v6",JSON.stringify(S));
}
function load(){
  try{
    const r=localStorage.getItem("ks_v6");
    if(r){
      S=Object.assign(S,JSON.parse(r));
      document.getElementById("pseudo").value=S.p||"";
      document.getElementById("role").value=S.r||"Switch";
      document.getElementById("sw-g").value=S.sw[0]||"Vert";
      document.getElementById("sw-o").value=S.sw[1]||"Orange";
      document.getElementById("sw-r").value=S.sw[2]||"Rouge";
      document.getElementById("sw-nv").value=S.sw[3]||"";
      document.getElementById("notes").value=S.n||"";
    }
  }catch(e){}
}
function shareApp(){
  const code=btoa(encodeURIComponent(JSON.stringify(S)));
  const url=location.origin+location.pathname+"#p="+code;
  if(navigator.clipboard)navigator.clipboard.writeText(url);
  prompt("Copie ce lien de partage pour ton/ta partenaire :",url);
}
function setM(m){
  mode=m;
  document.getElementById("m-duo").className=m==="duo"?"tbtn act":"tbtn";
  document.getElementById("m-ds").className=m==="ds"?"tbtn act":"tbtn";
}
function compare(){
  const raw=document.getElementById("p-code").value.trim();
  if(!raw)return alert("Colle d'abord le lien ou code reçu.");
  let P;
  try{P=JSON.parse(decodeURIComponent(atob(raw.includes("#p=")?raw.split("#p=")[1]:raw)));}
  catch(e){return alert("Lien ou code invalide.");}
  let yes=[],cur=[],syn=[],no=[];
  const myN=S.p||"Moi",pN=P.p||"Partenaire",myD=defDir(S.r),pD=defDir(P.r||"Switch");
  CATS.forEach((c,ci)=>c[1].forEach((name,ii)=>{
    const k=ci+"_"+ii,uV=S.ans[k]||"neu",pV=(P.ans&&P.ans[k])||"neu";
    const uP=S.dir[k]||myD,pP=(P.dir&&P.dir[k])||pD;
    if(uV==="yes"&&pV==="yes"){
      yes.push(name);
      if((uP==="Dom"&&pP==="Sub")||(uP==="Sub"&&pP==="Dom"))syn.push(name+" ("+(uP==="Dom"?myN+" Dom":pN+" Dom")+")");
    }else if((uV==="yes"||uV==="cur")&&(pV==="yes"||pV==="cur"))cur.push(name);
    if(pV==="no")no.push(name);
  }));
  document.getElementById("comp-res").innerHTML=`<div class="card"><div style="font-weight:800;color:var(--burg);margin-bottom:10px">${myN} (${S.r}) ✦ ${pN} (${P.r||'Switch'})</div><div style="margin-bottom:10px"><div style="font-size:0.8rem;font-weight:700;color:var(--yes)">🟢 Oui en commun (${yes.length})</div><div>${yes.map(x=>`<span class="tag t-yes">\${x}</span>`).join("")||"Aucun"}</div></div>${syn.length?`<div style="margin-bottom:10px"><div style="font-size:0.8rem;font-weight:700;color:var(--burg)">⚡ Synergies Donneur/Receveur (${syn.length})</div><div>${syn.map(x=>`<span class="tag t-syn">${x}</span>`).join("")}</div></div>`:""}<div style="margin-bottom:10px"><div style="font-size:0.8rem;font-weight:700;color:var(--cur)">🟡 À explorer ensemble (${cur.length})</div><div>${cur.map(x=>`<span class="tag t-cur">\${x}</span>`).join("")||"Aucun"}</div></div>${mode==="ds"?`<hr style="margin:12px 0;border:none;border-top:1px solid var(--bdr)"><div style="margin-bottom:10px"><div style="font-size:0.8rem;font-weight:700;color:var(--no)">🔴 Hard Limits de \${pN} (${no.length})</div><div>${no.map(x=>`<span class="tag t-no">${x}</span>`).join("")||"Aucune"}</div></div><div style="font-size:0.78rem;background:var(--inp);padding:10px;border-radius:8px;line-height:1.6"><b>Safewords :</b> ${(P.sw\vert{}\vert{}[]).slice(0,3).join(" / ")}<br><b>Non-Verbal :</b> ${(P.sw&&P.sw[3])||"Non précisé"}<br><b>Allergies :</b> ${(P.all\vert{}\vert{}[]).join(", ")\vert{}\vert{}"Aucune"}<br><b>Fragilités :</b> ${(P.med||[]).join(", ")||"Aucune"}<br><b>Aftercare :</b> ${(P.aft\vert{}\vert{}[]).join(", ")\vert{}\vert{}"Non précisé"}<br>${P.n?`<i>"${P.n}"</i>`:""}</div>`:""}</div>`;
}
function demo(){
  const d={p:"Elena",r:"Soumis(e)",ans:{"0_0":"yes","0_1":"yes","1_0":"yes","1_1":"yes","3_0":"yes","3_3":"cur","4_5":"no"},dir:{"0_0":"Sub","1_0":"Sub"},sw:["Vert","Orange","Rouge","Taper 3 fois"],all:["Latex"],med:["Poignets fragiles"],aft:["Câlins & contact"],n:"Attention poignet gauche"};
  document.getElementById("p-code").value=btoa(encodeURIComponent(JSON.stringify(d)));
  compare();
}
function resetApp(){if(confirm("Tout effacer ?")){localStorage.removeItem("ks_v6");location.hash="";location.reload();}}
load();draw();drawChecks();
if(location.hash.startsWith("#p=")){document.getElementById("p-code").value=location.hash.replace("#p=","");goTab(3);compare();}
</script>
</body>
</html>
